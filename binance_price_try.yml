openapi: 3.1.0
info:
  title: Binance Spot Price API (TRY Pariteleri)
  version: 1.0.0
paths:
  /api/v3/ticker/price:
    get:
      operationId: getBinancePriceTRY
      summary: Get current price of a TRY-based coin pair
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: Coin pair symbol (must end with TRY, e.g., BTCTRY, AVAXTRY)
      responses:
        '200':
          description: Successful price retrieval
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  price:
                    type: string
servers:
  - url: https://api.binance.com
